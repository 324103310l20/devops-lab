---
- name: Install Jenkins on the tradelive VM
  hosts: tradelive
  become: yes

  tasks:
    - name: Install Java 21 and helpers
      apt:
        name:
          - openjdk-21-jre
          - fontconfig
          - gnupg
        update_cache: yes
        state: present

    - name: Make sure the keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download the Jenkins repository key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Add the Jenkins LTS repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Enable and start Jenkins
      systemd:
        name: jenkins
        enabled: yes
        state: started

    - name: Wait for Jenkins to start
      wait_for:
        port: 8080
        host: 127.0.0.1
        delay: 10
        timeout: 120

    - name: Read the Jenkins initial admin password
      command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_unlock
      changed_when: false
      no_log: true

    - name: Show the unlock password
      debug:
        msg: "Unlock password: {{ jenkins_unlock.stdout }}"
